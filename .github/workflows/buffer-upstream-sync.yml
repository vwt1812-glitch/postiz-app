name: Review upstream updates
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository != 'gitroomhq/postiz-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream into a review branch
        id: merge
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/gitroomhq/postiz-app.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then exit 0; fi
          git switch -C sync/upstream-buffer
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo 'Upstream conflicts require manual review; the fork and installation were not changed.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git push --force-with-lease origin sync/upstream-buffer
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Open review PR and run checks explicitly
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if ! gh pr list --head sync/upstream-buffer --json number --jq '.[0].number' | grep -q '[0-9]'; then
            gh pr create --head sync/upstream-buffer --base main --title 'Sync official Postiz updates' --body 'Merges upstream into the Buffer fork for review. Buffer tests and native ARM64/AMD64 builds run separately. No deployment or automatic merge.'
          fi
          # PRs opened with GITHUB_TOKEN do not trigger pull_request workflows.
          gh workflow run buffer-ci.yml --ref sync/upstream-buffer
